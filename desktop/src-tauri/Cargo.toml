[package]
name = "log-sentinel"
version = "1.0.0"
description = "LogSentinel Desktop: AI agent for log analysis"
authors = ["Yafi Blum"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-shell = "2"     # הפעלת ה-sidecar (server.exe)
tauri-plugin-dialog = "2"    # חלונות "בחירת תיקייה" ו"שמירה בשם"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
